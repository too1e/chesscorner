<html lang="en">
<head>

<title>Chess Corner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='2' y='2' width='6' height='6' fill='%23fff'/%3E%3Crect x='8' y='8' width='6' height='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #050505; --panel: #0d0d0d; --panel2: #151515; --line: #232323; --line2: #333; --fg: #f2f2f2;
    --muted: #8c8c8c; --dim: #5c5c5c; --accent: #ffffff; --good: #6ee7a0; --bad: #ff6b6b; --warn: #e9c46a;
    --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", monospace;
    --blitz: #a3a3a3; --bullet: #6b6b6b; --rapid: #ffffff;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: #333 #0a0a0a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.5 "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--fg); }

  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .28em; font-size: 12px; white-space: nowrap; }
  .brand svg { display: block; }
  nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; height: 100%; }
  nav button { background: none; border: 0; color: var(--muted); padding: 0 12px; font: 500 11px "Inter", "Segoe UI", sans-serif; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; border-bottom: 1px solid transparent; white-space: nowrap; height: 100%; }
  nav button.on { color: var(--fg); border-bottom-color: var(--fg); }
  nav button:hover { color: var(--fg); }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }

  main { max-width: 1320px; margin: 0 auto; padding: 12px 24px 16px; }
  .btn { background: transparent; color: var(--fg); border: 1px solid var(--line2); border-radius: 3px; padding: 6px 12px; font: 500 11px "Inter", "Segoe UI", sans-serif; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  .btn:hover { border-color: var(--fg); }
  .btn.primary { background: var(--fg); color: #000; border-color: var(--fg); font-weight: 700; }
  .btn:disabled { opacity: .35; cursor: default; }
  .grid { display: grid; gap: 12px; }
  .two { grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }
  .three { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; position: relative; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .big { font: 600 30px/1.1 var(--mono); letter-spacing: -.02em; }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  .small { font-size: 12px; }
  .note { color: var(--dim); font-size: 11.5px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  th { color: var(--dim); font-weight: 500; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--panel2); }
  .pill { display: inline-block; padding: 1px 8px; border: 1px solid var(--line2); border-radius: 2px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pill.side-white { background: #e8e8e8; color: #111; border-color: #e8e8e8; font-weight: 600; } .pill.side-black { background: #000; color: #9a9a9a; border-color: #444; }
  tr.opgroup td { font: 600 10px "Inter", "Segoe UI", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 14px 6px 6px; border-bottom: 1px solid var(--line); }
  tr.opgroup:first-child td { padding-top: 4px; }
  .win { color: var(--good); } .loss { color: var(--bad); } .draw { color: var(--muted); }
  .hide { display: none !important; }
  .banner { padding: 10px 14px; border: 1px solid var(--line2); border-left: 2px solid var(--fg); background: var(--panel); margin-bottom: 16px; font-size: 12.5px; }
  .banner.warn { border-left-color: var(--bad); }
  svg text { fill: var(--dim); font: 10px var(--mono); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 11px; color: var(--muted); margin-top: 8px; letter-spacing: .06em; text-transform: uppercase; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  /* filters */
  .bar { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; }
  .seg button { background: transparent; color: var(--muted); border: 0; border-right: 1px solid var(--line2); padding: 5px 11px; font: 500 10.5px "Inter", "Segoe UI", sans-serif; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--fg); }
  .seg button.on { background: var(--fg); color: #000; font-weight: 700; }
  /* board views: everything sized to the window */
  :root { --S2: min(calc(100vh - 176px), 600px); --S3: min(calc(100vh - 222px), 600px); }
  .opwrap { display: grid; grid-template-columns: minmax(340px, 1fr) auto; gap: 12px; align-items: start; }
  .opleft { display: grid; gap: 10px; min-width: 0; grid-template-columns: minmax(0, 1fr); } .opleft .card { padding: 10px 12px; min-width: 0; overflow: hidden; } .opleft .card h2 { margin-bottom: 6px; }
  #opList { table-layout: fixed; } #opList .opname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #opList td:nth-child(2) { width: 62px; } #opList td:nth-child(3) { width: 36px; } #opList td:nth-child(4) { width: 124px; }
  #opList td { padding: 4px 6px; } #opList .btn { padding: 4px 9px; font-size: 10px; } #opReport td, #opReport th { padding: 4px 6px; }
  .ophead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; } .ophead h2 { margin: 0; }
  .oprow { display: flex; gap: 14px; align-items: flex-start; }

  .opmsg { width: 240px; font-size: 13.5px; line-height: 1.55; }

  .exwrap svg { display: block; width: var(--S3); height: var(--S3); min-width: 280px; min-height: 280px; }
  #exInfo { max-height: calc(100vh - 92px); overflow: auto; } #exInfo table td, #exInfo table th { padding: 5px 8px; }
  .scrollcard { max-height: calc(100vh - 92px); overflow: auto; }
  @media (max-width: 1150px) { .opwrap, .exwrap { grid-template-columns: 1fr; } .oprow { flex-wrap: wrap; } .oprow svg, .exwrap svg { width: min(100%, 520px); height: auto; } }
  /* accuracy by move number */
  .mamain { display: flex; gap: 18px; align-items: flex-start; } .machart { flex: 1.7; min-width: 0; } .maside { flex: 1; min-width: 260px; }
  .maphases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mph { border: 1px solid var(--line); background: #0a0a0a; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .mph .k { font: 600 9.5px "Inter", "Segoe UI", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); } .mph b { font: 600 22px var(--mono); letter-spacing: -.03em; }
  .mactl { margin-top: 12px; } .mactl progress { margin-bottom: 4px; }
  @media (max-width: 1000px) { .mamain { flex-wrap: wrap; } }
  /* accuracy by game length */
  .lbars { position: relative; display: flex; gap: 10px; align-items: flex-end; border-bottom: 1px solid var(--line2);
    background: repeating-linear-gradient(to top, transparent 0, transparent 36px, #161616 36px, #161616 37px); }
  .lcol { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; cursor: default; }
  .lcol .lv { font: 600 11.5px var(--mono); margin-bottom: 3px; color: var(--fg); }
  .lcol .lbar { width: 100%; background: #8a8a8a; transition: background .12s; } .lcol:hover .lbar { background: #fff; }
  .lavg { position: absolute; left: 0; right: 0; border-top: 1px dashed #ff6b6b; pointer-events: none; } .lavg span { position: absolute; left: 0; top: -15px; font: 10px var(--mono); color: #ff8a8a; }
  .llabs { display: flex; gap: 10px; margin-top: 5px; } .llab { flex: 1; text-align: center; font: 11px var(--mono); color: var(--muted); } .llab span { display: block; color: var(--dim); font-size: 10px; }
  /* narrow screens (phones, small windows) */

    :root { --S: min(calc(100vw - 96px), 560px); --S2: min(calc(100vw - 64px), 520px); --S3: min(calc(100vw - 64px), 520px); --GV: min(calc(100vw - 108px), 480px); --RV: min(calc(100vw - 100px), 520px); }

    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.two, .grid.three { grid-template-columns: minmax(0, 1fr); }
    .mamain, .rvmain, .oprow, .gvbody, .pzcard { flex-wrap: wrap; } .machart, .maside { flex: 1 1 100%; }
    main { padding: 10px 12px 40px; } header { padding: 0 12px; gap: 10px; }
    .scrollcard, #exInfo { max-height: none; }
    .oprow svg, .exwrap svg, .rvmain #rvBoard, .gvrow svg, .pzrow svg { min-width: 0; }
  }
  @media (max-width: 560px) {
    .tiles { grid-template-columns: minmax(0, 1fr); } .wgrid, .habgrid { grid-template-columns: minmax(0, 1fr); }
    .status { display: none; } .bar { gap: 8px; } .seg button { padding: 5px 8px; }
    #exportBtn, #refreshBtn { padding: 5px 8px; font-size: 10px; }
  }
  /* review viewer */

  .rvbig { font: 600 28px/1 var(--mono); letter-spacing: -.03em; }

  .rvside .note { flex: none; }
  #rvGraph { width: 100%; height: auto; cursor: pointer; background: #0a0a0a; border: 1px solid var(--line); }

  @media (max-width: 1150px) { .rvwrap { grid-template-columns: 1fr; } .rvmain { flex-wrap: wrap; } .rvside { height: auto; min-height: 0; } .rvmoves { flex: none; max-height: 240px; } }
  /* game viewer dialog */

  .gvbody { display: flex; gap: 16px; align-items: flex-start; }

  .gvright { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 8px; }
  .gvcap { min-height: 3.6em; font-size: 13px; line-height: 1.5; }

  .gvnav, .gvlinks { display: flex; gap: 6px; flex-wrap: wrap; }
  @media (max-width: 760px) { .gvbody { flex-wrap: wrap; } }
  /* training: one screen */
  .calrow { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; }
  .cd { display: grid; gap: 2px; text-align: center; } .cd span { font: 9px var(--mono); color: var(--dim); }
  .cd b { display: block; height: 20px; line-height: 19px; font: 600 10px var(--mono); border: 1px solid #262626; background: #101010; }
  .cd.today b { border-color: #fff; } .cd.today span { color: var(--fg); }

  .trcol .card { padding: 10px 12px; min-width: 0; overflow: hidden; } .trcol .card h2 { margin-bottom: 7px; }
  .trcol .meter { margin-bottom: 3px; padding: 2px 4px; } .trcol .meter .mh { margin-bottom: 3px; font-size: 12px; }
  .lrow .small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .lrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); } .lrow:last-child { border-bottom: 0; }

  .evalbar { position: relative; width: 38px; background: #2a2a2a; border: 1px solid var(--line2); flex: none; }

<script>
"use strict";
const TCS = ["rapid", "blitz", "bullet"];
const STYLE = { rapid: { c: "#ffffff", w: 2.2, d: "" }, blitz: { c: "#858585", w: 2, d: "" }, bullet: { c: "#5c5c5c", w: 1.8, d: "5 4" } };
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); Object.assign(e, attrs); e.innerHTML = html; return e; };

const tip = t => ` data-tip="${String(t ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;")}"`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(Math.round(n));
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- offline copy: the same page, answering its own questions from data baked into the file ---------- */
const IS_SNAPSHOT = !!window.__SNAPSHOT__;
const pieceUrl = code => IS_SNAPSHOT ? window.__SNAPSHOT__.pieces[code] : `pieces/${code}.svg`;
const SNAP_NEEDS_HELPER = "That part needs the desktop helper (Stockfish and the opening book run there). Everything else works in this copy.";
let snapIdx = null;
function snapPositions(g) {
  const n = g.moves.length, out = [];
  for (let k = 0; k <= n; k++) out.push({ fen: `${g.pf[k]} ${k % 2 === 0 ? "w" : "b"} - - 0 ${Math.floor(k / 2) + 1}`, turn: k % 2 === 0 ? "white" : "black", legal: [], last: k ? g.moves[k - 1] : null, san: k ? g.san[k - 1] : null,

}
async function snapApi(path, body) {
  const S = window.__SNAPSHOT__, u = new URL(path, "http://snapshot.local"), p = u.pathname, q = u.searchParams, no = () => { throw new Error(SNAP_NEEDS_HELPER); };
  if (!snapIdx) { snapIdx = { full: new Map(), open: new Map() }; for (const [id, g] of Object.entries(S.games)) { snapIdx.full.set(g.moves.join(" "), id); snapIdx.open.set(g.moves.slice(0, g.openPly).join(" ") + "|" + g.openPly, id); } }

    case "/api/rows": return { player: S.player, generated: S.generated, synced: S.generated, rows: S.rows };
    case "/api/summary": return S.summary;
    case "/api/games": return S.games_list.slice(0, +(q.get("limit") || 60));
    case "/api/game": { const g = S.games[q.get("id")]; if (!g) throw new Error("That game isn't stored in this copy."); return { id: q.get("id"), color: g.color, moves: g.moves, san: g.san, fens: [], url: g.url, tc: g.tc, result: g.result }; }
    case "/api/position": { const id = body && snapIdx.full.get((body.moves || []).join(" ")); if (!id || String(body.fen).split(" ")[0] !== "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR") no(); return snapPositions(S.games[id]); }
    case "/api/explore": { const key = ((body && body.moves) || []).join(" "), id = snapIdx.full.get(key);
      if (id) { const g = S.games[id]; return { left_at: g.left_at, last_named: g.last_named, current: g.current }; }
      const oid = snapIdx.open.get(key + "|" + body.moves.length); if (oid) return { current: { name: S.games[oid].openName } }; no(); }
    case "/api/review": { const r = S.reviews[q.get("id")]; if (!r) throw new Error("not reviewed"); return r; }
    case "/api/moveacc": return S.moveacc[q.get("tc") || ""] || S.moveacc[""];
    case "/api/opening/lines": return S.opening_lines;
    case "/api/opening/line": return S.opening_line[q.get("id")];
    case "/api/opening/report": return S.opening_report;
    case "/api/opening/explore": { const d = S.opening_explore[q.get("name") + "|" + q.get("color")]; if (!d) throw new Error("No games for that opening in this copy."); return d; }
    case "/api/opening/record": return { ok: true };

  }
}
function snapNotes() {
  const msg = t => `<div class="card"><h2>${t}</h2><p class="muted">${SNAP_NEEDS_HELPER}</p><p class="small dim">This is an offline copy saved on ${fmtDate(window.__SNAPSHOT__.generated)}. Open the dashboard on your computer for the live version.</p></div>`;
  $("#tab-explorer").innerHTML = msg("Opening explorer"); $("#tab-training").innerHTML = msg("Training");
}

let online = false;
async function api(path, body) {
  if (IS_SNAPSHOT) return snapApi(path, body);
  let r;
  try { r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}); }
  catch (e) { throw new Error("Can’t reach the Chess Corner helper. Double-click “Start Chess Corner.command” to start it, then reload."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const swatch = tc => `<svg width="22" height="8" style="display:block"><line x1="0" y1="4" x2="22" y2="4" stroke="${STYLE[tc].c}" stroke-width="${STYLE[tc].w}" stroke-dasharray="${STYLE[tc].d}"/></svg>`;

/* ---------- generic line chart (used for accuracy trends and the review graph) ---------- */
function lineChart(series, { w = 560, h = 200, yMin, yMax, pad = { l: 40, r: 10, t: 10, b: 22 }, xLabels = [] }) {
  const pts = series.flatMap(s => s.points);
  if (!pts.length) return `<p class="muted small">No data in this period.</p>`;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const lo = yMin ?? Math.floor(Math.min(...ys) / 50) * 50, hi = yMax ?? Math.ceil(Math.max(...ys) / 50) * 50;
  const X = x => pad.l + (x1 === x0 ? 0 : (x - x0) / (x1 - x0)) * (w - pad.l - pad.r);
  const Y = y => pad.t + (1 - (y - lo) / ((hi - lo) || 1)) * (h - pad.t - pad.b);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = Y(v); g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y}" y2="${y}" stroke="#1d1d1d"/><text x="${pad.l - 7}" y="${y + 3.5}" text-anchor="end">${Math.round(v)}</text>`; }
  for (const xl of xLabels) g += `<text x="${X(xl.x)}" y="${h - 6}" text-anchor="middle">${esc(xl.text)}</text>`;
  for (const s of series) {
    if (!s.points.length) continue;
    const d = s.points.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 1.8}" stroke-dasharray="${s.dash || ""}" stroke-linejoin="round"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}</svg>`;
}

/* ---------- data + filters ---------- */
let ROWS = [], GENERATED = 0, S = null;
const PERIODS = [["10", "10 games", { games: 10 }], ["25", "25 games", { games: 25 }], ["week", "Week", { days: 7 }], ["month", "Month", { days: 30 }],
  ["quarter", "3 months", { days: 90 }], ["year", "Year", { days: 365 }], ["all", "All time", {}]];
let MODE = store.get("cc_mode", "all"), PERIOD = store.get("cc_period", "month"), PER_MODE = store.get("cc_permode", false);
// "N games" with All selected: either the last N overall, or the last N of each mode (PER_MODE)
const perModeOn = () => MODE === "all" && PER_MODE && !!PERIODS.find(p => p[0] === PERIOD)[2].games;
function lastGames(base, n, skip = 0) {
  if (!perModeOn()) return base.slice(Math.max(0, base.length - skip - n), base.length - skip);
  const keep = new Set(TCS.flatMap(tc => { const m = base.filter(x => x.tc === tc); return m.slice(Math.max(0, m.length - skip - n), m.length - skip); }));
  return base.filter(x => keep.has(x));
}
function filtered() {
  let r = ROWS.filter(x => MODE === "all" || x.tc === MODE);
  const p = PERIODS.find(p => p[0] === PERIOD)[2];
  if (p.days) { const cutoff = Date.now() / 1000 - p.days * 86400; r = r.filter(x => x.t >= cutoff); }
  if (p.games) r = lastGames(r, p.games);
  return r;
}
const KIND = ["Queen", "Rook", "Bishop", "Knight", "Pawn", "Discovered / double"];

/* ---------- overview ---------- */
function spark(vals, h = 36, label = "", unit = "", digits = 0) {
  if (vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals), r = (hi - lo) || 1, w = 200;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 4 - (v - lo) / r * (h - 8)).toFixed(1)}`).join(" ");
  return `<svg class="spark" data-vals="${vals.map(v => v.toFixed(2)).join(",")}" data-label="${esc(label)}" data-unit="${esc(unit)}" data-digits="${digits}" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block;margin-top:auto;padding-top:10px"><polyline points="${pts}" fill="none" stroke="#9a9a9a" stroke-width="1.4" vector-effect="non-scaling-stroke"/><line class="sl" y1="0" y2="${h}" stroke="#fff" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/></svg>`;
}
const rollingMean = (vals, n) => vals.map((_, i) => mean(vals.slice(Math.max(0, i - n + 1), i + 1)));
const tile = (label, big, sub, extra = "", cls = "", meta = "", side = "") => `<div class="tile"><div class="lh"><span class="l">${label}</span><span class="meta">${meta}</span></div>${big ? `<div class="vrow"><div class="v ${cls}">${big}</div><div class="side">${side}</div></div>` : ""}${sub ? `<div class="s">${sub}</div>` : ""}${extra}</div>`;
const meter = (label, p, text, sub) => `<div class="meter"><div class="mh"><span>${label}</span><span class="mono">${text}</span></div><div class="track"><div class="fill" style="width:${Math.max(0, Math.min(100, p))}%"></div></div><div class="small dim" style="margin-top:5px">${sub}</div></div>`;

/* ---------- overview helpers ---------- */
function previousRows() {
  const p = PERIODS.find(p => p[0] === PERIOD)[2];
  const base = ROWS.filter(x => MODE === "all" || x.tc === MODE);
  if (p.days) { const end = Date.now() / 1000 - p.days * 86400, start = end - p.days * 86400; return base.filter(x => x.t >= start && x.t < end); }
  if (p.games) return lastGames(base, p.games, p.games);
  return null;
}
function chip(cur, prev, { goodUp = true, unit = "", digits = 0 } = {}) {
  if (cur == null || prev == null || !isFinite(cur) || !isFinite(prev)) return "";
  const d = cur - prev; if (Math.abs(d) < Math.pow(10, -digits) / 2) return `<em class="dl">= prev</em>`;
  return `<em class="dl ${(d > 0) === goodUp ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d).toFixed(digits)}${unit}</em>`;
}
const winPctOf = a => a && a.length ? 100 * a.filter(r => r.outcome === "win").length / a.length : null;
const periodDef = () => PERIODS.find(p => p[0] === PERIOD)[2];
function periodSlice(rows) {   // the selected period applied to one mode's games
  const p = periodDef();
  if (p.days) { const cutoff = Date.now() / 1000 - p.days * 86400; return rows.filter(x => x.t >= cutoff); }
  if (p.games) return rows.slice(-p.games);
  return rows;
}

/* compact stats beside the chart */
function watchList(F) {
  const modes = MODE === "all" ? TCS : [MODE], byTc = (a, tc) => a.filter(r => r.tc === tc);
  const withF = F.filter(r => r.cm), nf = withF.length || 1;
  const today = ROWS.filter(r => (MODE === "all" || r.tc === MODE) && new Date(r.t * 1000).toDateString() === new Date().toDateString());

  const given = sum(withF.map(r => sum(r.cm))) / nf, taken = sum(withF.map(r => sum(r.co))) / nf;

/* habits: win rate when you do the thing vs when you don't */
function habitsHTML(F) {
  const withF = F.filter(r => r.cm), wr = a => a.length ? 100 * a.filter(r => r.outcome === "win").length / a.length : null;
  const castled = withF.filter(r => r.cast_me != null), notCastled = withF.filter(r => r.cast_me == null);
  const qe = withF.filter(r => r.qearly), qn = withF.filter(r => !r.qearly);
  const hi = F.filter(r => r.opp > r.rating), lo = F.filter(r => r.opp <= r.rating);
  const white = F.filter(r => r.color === "white"), black = F.filter(r => r.color === "black");
  const habits = [
    { name: "Castling", freq: `${pct(castled.length, withF.length)}% of games`, a: castled, b: notCastled, al: "castled", bl: "didn't", verdict: "when castled" },
    { name: "Early queen", freq: `${pct(qe.length, withF.length)}% by move 5`, a: qe, b: qn, al: "queen early", bl: "queen later", verdict: "with an early queen" },
    { name: "Opponent rating", freq: `${pct(hi.length, F.length)}% higher`, a: hi, b: lo, al: "higher-rated", bl: "equal / lower", neutral: true, verdict: "vs higher-rated" },
    { name: "Colour", freq: `${pct(white.length, F.length)}% as white`, a: white, b: black, al: "as white", bl: "as black", neutral: true, verdict: "as white" },
  ];
  return `<div class="habgrid">` + habits.map(h => {
    const a = wr(h.a), b = wr(h.b), small = Math.min(h.a.length, h.b.length) < 10;
    const d = a != null && b != null ? a - b : null;
    const good = d == null || h.neutral ? "" : (d > 0 ? "up" : "down");
    const bar = (label, v, n, alt) => `<div class="hb"${tip(`${h.name}: ${label}\n${v == null ? "no games" : Math.round(v) + "% win rate"} over ${n} games`)}><span class="hl">${label} <span class="dim">${n}</span></span><div class="hbar"><i class="${alt ? "alt" : ""}" style="width:${v || 0}%"></i></div><b>${v == null ? "–" : Math.round(v) + "%"}</b></div>`;
    return `<div class="hab"><div class="hh"><span>${h.name}</span><span class="dim">${h.freq}</span></div>${bar(h.al, a, h.a.length, false)}${bar(h.bl, b, h.b.length, true)}
      <div class="hd ${small ? "" : good}"${small ? tip("* Fewer than 10 games in one of the two groups, so treat this as a rough guide.") : ""}>${d == null ? "not enough games" : `${d >= 0 ? "+" : "−"}${Math.abs(Math.round(d))} pts ${h.verdict}${small ? " *" : ""}`}</div></div>`;
  }).join("") + `</div>`;
}

/* accuracy by how long the game lasted */
function lengthCard(F) {
  const rows = F.filter(r => r.acc && r.plies), moves = r => Math.ceil(r.plies / 2);
  if (rows.length < 8) return `<p class="muted small">Not enough chess.com-reviewed games in this period.</p>`;
  const edges = [[0, 15, "≤ 15"], [16, 25, "16–25"], [26, 35, "26–35"], [36, 50, "36–50"], [51, 999, "51+"]];
  const bk = edges.map(([lo, hi, label]) => { const g = rows.filter(r => moves(r) >= lo && moves(r) <= hi); return { label, g, acc: g.length ? mean(g.map(r => r.acc)) : null, win: g.length ? winPctOf(g) : null }; });
  const avg = mean(rows.map(r => r.acc)), xs = rows.map(moves), ys = rows.map(r => r.acc), mx = mean(xs), my = mean(ys);
  let sxy = 0, sxx = 0, syy = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; syy += (ys[i] - my) ** 2; });
  const corr = sxx && syy ? sxy / Math.sqrt(sxx * syy) : 0, ok = bk.filter(b => b.g.length >= 8), first = ok[0], last = ok[ok.length - 1];
  let verdict;
  if (ok.length < 2) verdict = "Not enough games in different length ranges yet.";
  else if (Math.abs(corr) < .12) verdict = `Accuracy barely changes with game length (${Math.round(first.acc)}% in ${first.label}-move games, ${Math.round(last.acc)}% in ${last.label}).`;
  else if (corr < 0) verdict = `<b>Accuracy falls as games get longer:</b> ${Math.round(first.acc)}% in ${first.label}-move games → ${Math.round(last.acc)}% in ${last.label}.`;
  else verdict = `<b>Accuracy rises in longer games:</b> ${Math.round(first.acc)}% in ${first.label}-move games → ${Math.round(last.acc)}% in ${last.label}.`;
  const H = 190;
  const cols = bk.map(b => `<div class="lcol"${tip(b.g.length ? `${b.label} moves: ${Math.round(b.acc)}% average accuracy\n${b.g.length} reviewed games · ${Math.round(b.win)}% win rate` : `${b.label} moves: no reviewed games`)}>
      <span class="lv">${b.acc == null ? "–" : Math.round(b.acc) + "%"}</span><div class="lbar" style="height:${b.acc == null ? 0 : Math.max(2, b.acc / 100 * H)}px"></div></div>`).join("");
  const labs = bk.map(b => `<div class="llab">${b.label}<span>${b.g.length} game${b.g.length === 1 ? "" : "s"}</span></div>`).join("");
  return `<div class="lbars" style="height:${H + 22}px"><div class="lavg" style="bottom:${avg / 100 * H}px"><span>avg ${Math.round(avg)}%</span></div>${cols}</div><div class="llabs">${labs}</div>
    <div class="small" style="margin-top:12px">${verdict}</div><div class="note">Each bar is the average chess.com accuracy of games that lasted that many moves (yours), so it shows how accuracy changes with game length, not move by move.</div>`;
}

/* win rate by time of day, with the overall rate as a reference line */
function timeCard(F) {
  const overall = winPctOf(F) ?? 0, MIN = 30;   // below MIN games a time of day is too thin to compare
  const blocks = [["Night", "12–6am", 0, 6], ["Morning", "6am–12pm", 6, 12], ["Afternoon", "12–6pm", 12, 18], ["Evening", "6pm–12am", 18, 24]].map(([name, rng, a, b]) => {
    const g = F.filter(r => { const h = new Date(r.t * 1000).getHours(); return h >= a && h < b; });
    return { name, rng, n: g.length, w: g.length ? winPctOf(g) : null };
  });
  const rows = blocks.map(b => {
    if (b.w == null) return `<span class="dim">${b.name} <span style="font-size:10px">${b.rng}</span></span><div class="track" style="opacity:.4"></div><span class="dim mono" style="font-size:12px">no games</span>`;
    const thin = b.n < MIN;
    return `<span class="dim" style="white-space:nowrap">${b.name} <span style="font-size:10px">${b.rng}</span></span>
      <div class="track"${tip(`${b.name} (${b.rng})\n${Math.round(b.w)}% win rate over ${b.n} game${b.n === 1 ? "" : "s"}${thin ? "\nonly a few games, so this isn't reliable yet" : ""}\nyour overall win rate is ${Math.round(overall)}%`)}><div class="fill" style="width:${b.w}%;background:${thin ? "#555" : "#e5e5e5"}"></div><div class="tref" style="left:${overall}%"></div></div>
      <span class="mono" style="font-size:12px;white-space:nowrap"><b>${Math.round(b.w)}%</b> <span class="dim">· ${b.n} game${b.n === 1 ? "" : "s"}</span></span>`;
  }).join("");
  const solid = blocks.filter(b => b.n >= MIN), best = solid.slice().sort((x, y) => y.w - x.w)[0], worst = solid.slice().sort((x, y) => x.w - y.w)[0];
  const thinNames = blocks.filter(b => b.n > 0 && b.n < MIN).map(b => b.name.toLowerCase());
  let take;
  if (solid.length < 2) take = "Not enough games in different parts of the day to compare yet.";
  else if (best.w - worst.w < 8) take = `<b>No clear pattern.</b> You win about the same share of games at any time of day (${Math.round(worst.w)}–${Math.round(best.w)}%).`;
  else take = `<b>You win most in the ${best.name.toLowerCase()} (${Math.round(best.w)}%) and least in the ${worst.name.toLowerCase()} (${Math.round(worst.w)}%).</b>`;
  return `<div class="bars tod" style="grid-template-columns:112px 1fr 128px">${rows}</div>
    <div class="legend" style="margin-top:10px"><span><i class="refkey" style="margin:0 6px 0 0"></i>your overall win rate · ${Math.round(overall)}%</span></div>
    <div class="small" style="margin-top:8px">${take}</div>${thinNames.length ? `<div class="note">Grey bars (${thinNames.join(", ")}) have under ${MIN} games, so they're left out of the comparison.</div>` : ""}`;
}

/* ---------- drag / click move input (explorer, opening drill, puzzle trainer) ---------- */
function bindBoardInput(svg, o) {
  let drag = null;
  svg.style.touchAction = "none";
  const svgPoint = ev => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const sqAt = ev => { const e = document.elementFromPoint(ev.clientX, ev.clientY); return e && e.getAttribute ? e.getAttribute("data-sq") : null; };
  svg.addEventListener("pointerdown", ev => {
    const name = ev.target.getAttribute && ev.target.getAttribute("data-sq"); if (!name) return;
    ev.preventDefault();
    const sel = o.getSel();
    if (sel && name !== sel && !o.canPick(name)) { o.setSel(null); o.onMove(sel, name); return; }   // click a destination
    if (o.canPick(name)) {
      const wasSel = sel === name; o.setSel(name);
      drag = { from: name, wasSel, x: ev.clientX, y: ev.clientY, ghost: null };
      try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* not fatal */ }
    } else o.setSel(null);
  });
  svg.addEventListener("pointermove", ev => {
    if (!drag) return;
    if (!drag.ghost) {
      if (Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) < 5) return;
      const p = o.pieceAt(drag.from); if (!p) return;
      const g = document.createElementNS("http://www.w3.org/2000/svg", "image");
      g.setAttribute("href", pieceUrl((p === p.toUpperCase() ? "w" : "b") + p.toUpperCase()));
      g.setAttribute("width", 60); g.setAttribute("height", 60); g.style.pointerEvents = "none"; svg.appendChild(g); drag.ghost = g;
    }
    const pt = svgPoint(ev); drag.ghost.setAttribute("x", pt.x - 30); drag.ghost.setAttribute("y", pt.y - 30);
  });
  svg.addEventListener("pointerup", ev => {
    if (!drag) return; const d = drag; drag = null; if (d.ghost) d.ghost.remove();
    try { svg.releasePointerCapture(ev.pointerId); } catch (e) { /* not fatal */ }
    if (d.ghost) { const to = sqAt(ev); if (to && to !== d.from) { o.setSel(null); o.onMove(d.from, to); } }
    else if (d.wasSel) o.setSel(null);   // clicking the selected piece again puts it down
  });
  svg.addEventListener("pointercancel", () => { if (drag) { if (drag.ghost) drag.ghost.remove(); drag = null; } });
}
function renderGeneric(svg, st) {
  const size = 400, sq = 50, pcs = fenPieces(st.fen); let g = "";
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const file = st.flip ? 7 - f : f, rank = st.flip ? r : 7 - r, name = FILES[file] + (rank + 1), light = (file + rank) % 2 === 1;
    let fill = light ? LIGHT : DARK;

    if (st.hint === name) fill = "#f4a261"; if (st.sel === name) fill = "#f6f669";
    g += `<rect x="${f * sq}" y="${r * sq}" width="${sq}" height="${sq}" fill="${fill}" data-sq="${name}"/>`;
    const p = pcs[name]; if (p) g += pieceImg(p, f * sq, r * sq, sq);
    if (st.dests && st.dests.has(name)) g += `<circle cx="${f * sq + sq / 2}" cy="${r * sq + sq / 2}" r="${p ? sq * 0.45 : sq * 0.16}" fill="${p ? "none" : "rgba(30,60,15,.55)"}" stroke="${p ? "rgba(30,60,15,.55)" : "none"}" stroke-width="5" style="pointer-events:none"/>`;
    if (f === 0) g += `<text x="2" y="${r * sq + 11}" font-size="10" fill="#555" style="pointer-events:none">${rank + 1}</text>`;

      <polygon points="${x2},${y2} ${bx + Math.sin(ang) * hw},${by - Math.cos(ang) * hw} ${bx - Math.sin(ang) * hw},${by + Math.cos(ang) * hw}" fill="rgba(244,140,60,.92)" style="pointer-events:none"/>`;

/* ---------- puzzle trainer: a small analysis board with an eval bar ---------- */
const PZ = { list: [], i: -1, cur: null, state: "idle", attempts: 0, right: 0, recorded: false, start: { turn: "white", fullmove: 1 }, moves: [], pos: [], cursor: 0,
  sel: null, hint: null, flip: false, msg: "", ev: null, enginePv: [], engineSans: null, evalCache: new Map(), evalTicket: 0 };

const pzOwn = c => { const p = pzPos(); return !!(c && p && (c === c.toUpperCase()) === (p.turn === "white")); };
function plyLabel(k, san, first) {   // k = ply index counted from the puzzle position
  const w0 = PZ.start.turn === "white", white = w0 === (k % 2 === 0), num = PZ.start.fullmove + Math.floor((k + (w0 ? 0 : 1)) / 2);
  return white ? `${num}.${san}` : (first ? `${num}…${san}` : san);

}

async function pzEvalCurrent() {
  const p = pzPos(); if (!p) return;
  const ticket = ++PZ.evalTicket;
  if (p.mate) { PZ.ev = { cp: p.turn === "white" ? -10000 : 10000, pv: [] }; PZ.enginePv = []; PZ.engineSans = []; return pzDraw(); }
  if (p.over) { PZ.ev = { cp: 0, pv: [] }; PZ.enginePv = []; PZ.engineSans = []; return pzDraw(); }
  let r = PZ.evalCache.get(p.fen);
  if (!r) { const x = await sfEval(p.fen, 12); r = { cp: whiteCp(p.fen, x.score), pv: (x.pv || []).slice(0, 6) }; PZ.evalCache.set(p.fen, r); }
  if (ticket !== PZ.evalTicket) return;

  if (r.pv.length) {
    const resp = await api("/api/position", { fen: p.fen, moves: r.pv });
    if (ticket === PZ.evalTicket) { PZ.engineSans = resp.positions.slice(1).map(x => x.san); pzDraw(); }
  }
}

async function maAnalyse(count) {

    html = `${esc(sp.dataset.label)}<br><b>${vals[i].toFixed(+sp.dataset.digits)}${esc(sp.dataset.unit)}</b> <span class="dim">· game ${i + 1} of ${vals.length}</span>`;
  } else { const tg = t && t.closest("[data-tip]"); if (tg) html = esc(tg.dataset.tip).replace(/\n/g, "<br>"); }
  if (!html) { gtip.classList.add("hide"); return; }
  gtip.innerHTML = html; gtip.classList.remove("hide");
  const w = gtip.offsetWidth, h = gtip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  gtip.style.left = Math.max(4, x) + "px"; gtip.style.top = Math.max(4, y) + "px";
});
document.addEventListener("mouseleave", () => gtip.classList.add("hide"));

/* ---------- data loading, offline handling ---------- */
let SYNCED = 0;
function liveText() { if (!SYNCED) return "LIVE"; const m = Math.max(0, Math.round((Date.now() / 1000 - SYNCED) / 60)); return `LIVE · synced ${m < 1 ? "just now" : m + "m ago"}`; }
// pick up games played while the page is open: re-read every 3 minutes and redraw only if something changed
setInterval(async () => {
  if (!online || IS_SNAPSHOT) return;
  try {
    const r = await api("/api/rows"); SYNCED = r.synced;
    if (r.rows.length !== ROWS.length) { ROWS = r.rows; GENERATED = r.generated; store.set("cc_rows", r); renderOverview(); }
    setStatus(true, liveText());
  } catch (e) { /* the 8-second reconnect loop handles a dead helper */ }
}, 180000);
function setStatus(live, text) { $("#dot").classList.toggle("live", live); $("#statusTxt").textContent = text; }
let retry = null;
async function loadAll() {
  let fresh = false;
  try {
    const r = await api("/api/rows"); ROWS = r.rows; GENERATED = r.generated; SYNCED = r.synced; store.set("cc_rows", r); fresh = true; online = true;
  } catch (e) {
    online = false; const c = store.get("cc_rows", null);
    if (c) { ROWS = c.rows; GENERATED = c.generated; }
  }
  $("#offline").classList.toggle("hide", online);
  $("#refreshBtn").disabled = !online;
  if (IS_SNAPSHOT) { setStatus(false, "OFFLINE COPY · " + fmtShort(GENERATED)); $("#refreshBtn").classList.add("hide"); const eb = $("#exportBtn"); if (eb) eb.classList.add("hide"); }
  if (online) { if (!IS_SNAPSHOT) setStatus(true, liveText()); S = await api("/api/summary").catch(() => null); if (retry) { clearInterval(retry); retry = null; } }
  else {
    setStatus(false, "OFFLINE");
    $("#offline").innerHTML = ROWS.length ? `<b>The Chess Corner helper isn’t running.</b> Showing saved stats from ${fmtDate(GENERATED)}. Reviews, drills and syncing need it — double-click <span class="mono">Start Chess Corner.command</span> in the ChessCorner folder. This page reconnects by itself.`
      : `<b>The Chess Corner helper isn’t running</b>, and there’s no saved data yet. Double-click <span class="mono">Start Chess Corner.command</span> in the ChessCorner folder. This page reconnects by itself.`;
    if (!retry) retry = setInterval(loadAll, 8000);
  }
  if (ROWS.length) renderOverview(); else $("#tab-overview").innerHTML = "";
  if (IS_SNAPSHOT) snapNotes(); else renderTraining();
  renderBot();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hide", s.id !== "tab-" + b.dataset.tab));
  if (b.dataset.tab === "review") renderReviewList(); if (b.dataset.tab === "openings") renderOpenings(); if (b.dataset.tab === "explorer" && !IS_SNAPSHOT) renderExplorerTab(); if (b.dataset.tab === "mates") renderMates();
});
$("#refreshBtn").onclick = async () => {
  const b = $("#refreshBtn"), t = $("#statusTxt"); b.disabled = true; t.textContent = "SYNCING…";
  try { const r = await api("/api/refresh", {}); await loadAll(); t.textContent = r.added ? `+${r.added} GAMES` : "UP TO DATE"; setTimeout(() => { if (online) t.textContent = liveText(); }, 3000); }
  catch (e) { t.textContent = "SYNC FAILED"; }
  b.disabled = !online;
};
loadAll();
</script>
